name: CI (GitHub-native gates)

# GitHub keeps the low-cost guardrails.
# CircleCI owns the heavier lint/test/build/deploy work.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/goblin-api
  SANDBOX_IMAGE_NAME: ${{ github.repository_owner }}/goblin-sandbox

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce branch + commit policy
        run: bash tooling/automation/ci-policy-check.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-vector.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt

      - name: Run API lint (Ruff)
        run: cd apps/api && PYTHONPATH=src python -m ruff check --config pyproject.toml --ignore PLR0917 src/api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web lint (ESLint)
        run: pnpm --filter @goblin/web lint

      - name: Run lint policy
        run: make lint-policy

  api-cycles:
    name: api-cycles (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report API dependency cycles (true count, ignores baseline allowlist)
        run: make check-api-cycles-report

      - name: Add cycle count to CI summary
        run: |
          COUNT=$(python -c "import json; print(json.load(open('artifacts/api-cycles.json'))['cycle_count'])")
          {
            echo "### API dependency cycles"
            echo ""
            echo "Total cycle count: **${COUNT}**"
            echo ""
            echo "This is the true count, independent of the baseline allowlist in"
            echo "\`apps/api/architecture-boundaries.toml\`. The \`api-cycles-gate\` job below"
            echo "fails only on cycles that are not already in that baseline."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cycle graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-cycle-graph
          path: |
            artifacts/api-cycles.json
            artifacts/api-cycles.dot

  api-cycles-gate:
    name: api-cycles-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail on new API dependency cycles (existing baseline debt is allowed)
        run: make check-api-cycles

  contract:
    name: contract
    runs-on: ubuntu-latest
    needs: [policy, lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-vector.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI, route manifest, and frontend API path drift
        run: make contract-checks

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: [contract]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-vector.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt

      - name: Run API tests with coverage
        run: make test-api-coverage

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: [contract]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests with coverage
        run: make test-web-coverage

  merge-gates:
    name: merge-gates
    runs-on: ubuntu-latest
    needs: [lint, contract, test-backend, test-frontend, api-cycles-gate]
    if: always()
    steps:
      - name: Require lint, contract, backend coverage, frontend coverage, and no new API cycles
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint gate failed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.contract.result }}" != "success" ]; then
            echo "contract gate failed: ${{ needs.contract.result }}"
            exit 1
          fi
          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "backend coverage gate failed: ${{ needs.test-backend.result }}"
            exit 1
          fi
          if [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "frontend coverage gate failed: ${{ needs.test-frontend.result }}"
            exit 1
          fi
          if [ "${{ needs.api-cycles-gate.result }}" != "success" ]; then
            echo "api-cycles-gate failed: ${{ needs.api-cycles-gate.result }}"
            exit 1
          fi
          echo "All required pre-merge gates passed."

  live-auth-smoke-gate:
    name: live-auth-smoke-gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          LIVE_AUTH_BASE_URL: ${{ secrets.LIVE_AUTH_BASE_URL }}
          LIVE_AUTH_BACKEND_URL: ${{ secrets.LIVE_AUTH_BACKEND_URL }}
          LIVE_AUTH_EMAIL: ${{ secrets.LIVE_AUTH_EMAIL }}
          LIVE_AUTH_PASSWORD: ${{ secrets.LIVE_AUTH_PASSWORD }}
        run: |
          if [ -n "$LIVE_AUTH_BASE_URL" ] && \
             [ -n "$LIVE_AUTH_BACKEND_URL" ] && \
             [ -n "$LIVE_AUTH_EMAIL" ] && \
             [ -n "$LIVE_AUTH_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  live-auth-smoke:
    name: live-auth-smoke
    runs-on: ubuntu-latest
    needs: [contract, live-auth-smoke-gate]
    if: needs.live-auth-smoke-gate.outputs.enabled == 'true'
    timeout-minutes: 20
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.LIVE_AUTH_BASE_URL }}
      LIVE_AUTH_BACKEND_URL: ${{ secrets.LIVE_AUTH_BACKEND_URL }}
      LIVE_AUTH_EMAIL: ${{ secrets.LIVE_AUTH_EMAIL }}
      LIVE_AUTH_PASSWORD: ${{ secrets.LIVE_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live auth smoke
        run: pnpm --filter @goblin/web test:e2e:live

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [merge-gates]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-vector.txt

      - name: Install Python dependencies (for codegen)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: |
          PYTHONPATH=packages/shared/src python tooling/generators/generate-providers-json.py --check
          pnpm --filter @goblin/web build

  build-arm64:
    name: build-arm64
    runs-on: ubuntu-latest
    needs: [merge-gates]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push API image (linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64

      - name: Write image reference to CI summary
        run: |
          echo "### Built API image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-arm64-sandbox:
    name: build-arm64-sandbox
    runs-on: ubuntu-latest
    needs: [merge-gates]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract sandbox image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SANDBOX_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push sandbox image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile.sandbox
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-arm64
          cache-to: type=gha,mode=max,scope=sandbox-arm64

  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    needs: [build-arm64]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull --platform linux/arm64 ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Import smoke
        run: |
          docker run --rm --platform linux/arm64 \
            -e ENV=test \
            -e DATABASE_URL=sqlite:///tmp/smoke.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e SANDBOX_ENABLED=false \
            -e JWT_SECRET_KEY=smoke-test-secret-not-real \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_ANON_KEY=smoke \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke \
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            python -c "from api.main import app; print('import ok')"

      - name: Health smoke
        run: |
          docker run -d --platform linux/arm64 \
            --name smoke-api \
            -p 8000:8000 \
            -e ENV=test \
            -e DATABASE_URL=sqlite:///tmp/smoke.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e SANDBOX_ENABLED=false \
            -e JWT_SECRET_KEY=smoke-test-secret-not-real \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_ANON_KEY=smoke \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke \
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}

          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 2s..."
            sleep 2
          done

          echo "Health check failed after 60s"
          docker logs smoke-api
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f smoke-api 2>/dev/null || true
