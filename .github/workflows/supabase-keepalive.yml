name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep Supabase warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check keep-alive configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping Supabase keep-alive because SUPABASE_DB_URL is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install keep-alive dependency
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install --upgrade pip "psycopg[binary]>=3.2.0"

      - name: Ping Supabase
        if: steps.config.outputs.enabled == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/supabase_keepalive.py
