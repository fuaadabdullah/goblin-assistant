name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep Supabase warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install keep-alive dependency
        run: python -m pip install --upgrade pip "psycopg[binary]>=3.2.0"

      - name: Ping Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/supabase_keepalive.py
