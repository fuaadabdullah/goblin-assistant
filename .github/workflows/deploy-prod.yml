name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for production deploy"
        required: false
        default: "manual trigger"
  repository_dispatch:
    types: [deploy-prod]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://goblin-backend-dt30.onrender.com

jobs:
  pre-deploy-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production deployment only allowed from main branch"
            exit 1
          fi
          echo "On main branch"

      - name: Check required Render secrets
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "Missing RENDER_API_KEY secret"
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_SERVICE_ID_PROD }}" ]; then
            echo "Missing RENDER_SERVICE_ID_PROD secret"
            exit 1
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"

  approval:
    name: Manual Approval
    needs: [pre-deploy-checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Record approval
        run: |
          echo "Approved for production deployment"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Reason: ${{ github.event.inputs.reason || 'repository dispatch' }}"

  deploy-production:
    name: Deploy to Render Production
    needs: [approval]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"full"}'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}

      - name: Wait for deployment
        run: sleep 45

      - name: Health check
        run: |
          max_attempts=30
          attempt=0

          while [ "$attempt" -lt "$max_attempts" ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${PRODUCTION_URL}/api/v1/health")
            if [ "$response" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "Attempt ${attempt}/${max_attempts}: status ${response}; retrying in 10s"
            sleep 10
          done

          echo "Health check failed after ${max_attempts} attempts"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PRODUCTION_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
