name: Visual Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  visual-regression:
    name: visual-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI-impacting changes
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before || '' }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^(apps/web/|packages/ui/)' > /dev/null; then
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when no UI changes
        if: steps.changes.outputs.ui_changed == 'false'
        run: echo "No UI-impacting changes detected. Visual regression gate passes."

      - name: Set up pnpm
        if: steps.changes.outputs.ui_changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.changes.outputs.ui_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.changes.outputs.ui_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Storybook baseline
        if: steps.changes.outputs.ui_changed == 'true'
        run: pnpm --filter @goblin/web build-storybook

      - name: Run Chromatic
        if: steps.changes.outputs.ui_changed == 'true' && vars.CHROMATIC_ENABLED == 'true'
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          exitZeroOnChanges: true

      - name: Require Chromatic token when enabled
        if: steps.changes.outputs.ui_changed == 'true' && vars.CHROMATIC_ENABLED == 'true' && secrets.CHROMATIC_PROJECT_TOKEN == ''
        run: |
          echo "CHROMATIC_ENABLED is true but CHROMATIC_PROJECT_TOKEN is missing."
          exit 1
