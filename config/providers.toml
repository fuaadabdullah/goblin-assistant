# =============================================================================
# Goblin Assistant — SINGLE source of truth for all provider & system config
# =============================================================================
# Consumers:
#   - Python backend: apps/api/src/api/providers/dispatcher.py
#   - Python monitoring: apps/api/src/api/config/providers.py
#   - Python budget: apps/api/src/api/services/context_assembly_service/budget_manager.py
#   - TS frontend: apps/web/src/services/provider-router.ts  (via generated providers.json)
#   - RAPTOR router: apps/api/src/api/raptor_router.py
# =============================================================================

# ---------------------------------------------------------------------------
# Visible provider IDs  —  order controls UI / API listing order
# ---------------------------------------------------------------------------
visible_providers = [
  "groq",
  "deepseek",
  "gemini",
  "siliconeflow",
  "openai",
  "azure_openai",
  "anthropic",
  "together",
  "replicate",
  "cohere",
  "huggingface",
  "aliyun",
  "aws_vllm",
]

[default]
timeout_ms = 12000

[default.scoring_weights]
latency = 0.4
cost = 0.3
reliability = 0.2
bandwidth = 0.1

[default.chain_of_thought_suppression]
suppress_for = ["summary", "code"]
force_for = ["reasoning"]

[default.cost_optimization]
max_budget_per_hour = 10.0
preferred_providers_under_budget = [
  "groq",
  "siliconeflow",
  "azure",
  "deepseek",
  "openai",
]

[default.health]
health_check_interval = 30
timeout_seconds = 10
retry_attempts = 3

# ---------------------------------------------------------------------------
# RAPTOR profiler / sampler settings
# ---------------------------------------------------------------------------
[default.raptor]
level = "INFO"
file = "logs/raptor.log"
enable_cpu = true
enable_memory = true
sample_rate_ms = 200
trace_exceptions = true
enable_dev_flags = false

# ---------------------------------------------------------------------------
# Load-balancing & failover
# ---------------------------------------------------------------------------
[load_balancing]
enabled = true
strategy = "round_robin"
health_check_interval = 30
failure_threshold = 3
recovery_threshold = 2
failover_to_backup = true
max_failover_time = 60
circuit_breaker_enabled = true
circuit_breaker_failure_threshold = 3
circuit_breaker_recovery_timeout = 30

[load_balancing.health_checks]
ollama_health = "/api/tags"
router_health = "/health"
timeout_seconds = 10

[load_balancing.server_priorities]
primary_ollama = "192.175.23.150:8002"
backup_router = "45.61.51.220:8000"

# ---------------------------------------------------------------------------
# Provider aliases  —  any of these strings resolve to the canonical ID below
# ---------------------------------------------------------------------------
[provider_aliases]
azure                    = "azure_openai"
azure_openai             = "azure_openai"
azure-openai             = "azure_openai"
google                   = "gemini"
siliconflow              = "siliconeflow"
silicon_flow             = "siliconeflow"
silicone-flow            = "siliconeflow"
silicone_flow            = "siliconeflow"
ollama                   = "ollama_local"
ollama-local             = "ollama_local"
# AWS inference providers
aws                      = "aws_vm"
aws_vm                   = "aws_vm"
aws-vm                   = "aws_vm"
aws_vllm                 = "aws_vllm"
aws-vllm                 = "aws_vllm"
llamacpp                 = "aws_vm"
llama_cpp                = "aws_vm"
# Rovo Dev / Goblin Coder
rovo-dev                 = "rovo_dev"
goblin_coder             = "rovo_dev"
goblin-coder             = "rovo_dev"
gcp-vllm                 = "aws_vllm"
llamacpp                 = "gcp_vm"
llama_cpp                = "gcp_vm"

# ---------------------------------------------------------------------------
# Model aliases  —  short name → { provider, model }
# ---------------------------------------------------------------------------
[model_aliases]
"gpt-4o"                              = { provider = "openai",        model = "gpt-4o" }
"gpt-4o-mini"                         = { provider = "openai",        model = "gpt-4o-mini" }
"claude-haiku"                        = { provider = "anthropic",     model = "claude-3-5-haiku-latest" }
"claude-sonnet"                       = { provider = "anthropic",     model = "claude-sonnet-4-20250514" }
"llama-3.1-8b-instant"                = { provider = "groq",          model = "groq/compound-mini" }
"llama-3.3-70b-versatile"             = { provider = "groq",          model = "groq/compound" }
"mixtral-8x7b-32768"                  = { provider = "groq",          model = "groq/compound-mini" }
"qwen-max"                            = { provider = "aliyun",        model = "qwen-max" }
"qwen-plus"                           = { provider = "aliyun",        model = "qwen-plus" }
"qwen-7b"                             = { provider = "siliconeflow",  model = "Qwen/Qwen2.5-7B-Instruct" }
"qwen-coder"                          = { provider = "siliconeflow",  model = "Qwen/Qwen2.5-Coder-7B-Instruct" }
"deepseek-chat"                       = { provider = "deepseek",      model = "deepseek-chat" }
"gemini-flash"                        = { provider = "gemini",        model = "gemini-2.0-flash" }
# AWS vLLM (future GPU EC2 lane; inactive until AWS_VLLM_ENDPOINT is set)
# ---------------------------------------------------------------------------
[providers.aws_vllm]
name                    = "AWS vLLM"
endpoint_env            = "AWS_VLLM_ENDPOINT"
endpoint                = ""
api_key_env             = "AWS_VLLM_API_KEY"
default_model           = "qwen3-32b"
models                  = ["qwen3-32b", "gemma3-27b", "deepseek-r1-32b"]
capabilities            = ["chat", "reasoning", "code"]
priority_tier           = 65
cost_score              = 0.0
cost_input_per1k        = 0.0
cost_output_per1k       = 0.0
default_timeout_ms      = 60000
bandwidth_score         = 0.85
rate_limit_per_min      = 120
supports_cot            = true
cot_suppression_prompt  = "Be concise."
tier                    = "private"
display_name            = "AWS vLLM"
is_active               = true
selectable_requires_env = true

# AWS EC2 llama.cpp lane. Private endpoint is expected over Tailscale.
# ---------------------------------------------------------------------------
[providers.aws_vm]
name                    = "AWS EC2 llama.cpp"
endpoint_env            = "LLAMACPP_AWS_ENDPOINT"
endpoint                = ""
api_key_env             = "LLAMACPP_AWS_API_KEY"
proxy_env               = "LLAMACPP_AWS_PROXY"
invoke_timeout_s        = 600
default_model           = "goblin-core"
models                  = ["goblin-core"]
capabilities            = ["chat", "reasoning", "code"]
priority_tier           = 70
cost_score              = 0.05
default_timeout_ms      = 180000
bandwidth_score         = 0.5
rate_limit_per_min      = 120
supports_cot            = true
cot_suppression_prompt  = "Be concise."
tier                    = "self_hosted"
display_name            = "AWS EC2 llama.cpp"
is_active               = true
selectable_requires_env = true
hidden                  = true

# ---------------------------------------------------------------------------
# LiteLLM smart-routing model groups
# ---------------------------------------------------------------------------
[router_models."router-cheap"]
description = "Budget-first routing for routine chat"
routing_strategy = "latency-based-routing"
num_retries = 2
enable_pre_call_checks = true
fallbacks = ["router-code"]
context_window_fallbacks = ["gemini-2.5-flash"]
content_policy_fallbacks = ["gemini-2.5-flash"]

[[router_models."router-cheap".backends]]
provider_id       = "dashscope"
litellm_provider   = "dashscope"
model             = "qwen-turbo"
api_key_env       = "DASHSCOPE_API_KEY"
endpoint_env      = "DASHSCOPE_ENDPOINT"
order             = 1
cost_input_per1k  = 0.00005
cost_output_per1k = 0.00020

[[router_models."router-cheap".backends]]
provider_id       = "vertex_ai"
litellm_provider   = "vertex_ai"
model             = "gemini-2.5-flash-lite"
project_env       = "VERTEX_AI_PROJECT"
vertex_location_env    = "VERTEX_AI_LOCATION"
vertex_credentials_env  = "GOOGLE_APPLICATION_CREDENTIALS"
order             = 2
cost_input_per1k  = 0.00010
cost_output_per1k = 0.00040

[router_models."router-code"]
description = "Code-first routing for implementation work"
routing_strategy = "cost-based-routing"
num_retries = 2
enable_pre_call_checks = true
fallbacks = ["router-cheap"]
context_window_fallbacks = ["gemini-2.5-flash"]
content_policy_fallbacks = ["gemini-2.5-flash"]

[[router_models."router-code".backends]]
provider_id       = "dashscope"
litellm_provider   = "dashscope"
model             = "qwen3-coder-flash"
api_key_env       = "DASHSCOPE_API_KEY"
endpoint_env      = "DASHSCOPE_ENDPOINT"
order             = 1
cost_input_per1k  = 0.00011
cost_output_per1k = 0.00080

[[router_models."router-code".backends]]
provider_id       = "vertex_ai"
litellm_provider   = "vertex_ai"
model             = "gemini-2.5-flash"
project_env       = "VERTEX_AI_PROJECT"
vertex_location_env    = "VERTEX_AI_LOCATION"
vertex_credentials_env  = "GOOGLE_APPLICATION_CREDENTIALS"
order             = 2
cost_input_per1k  = 0.00030
cost_output_per1k = 0.00250

[router_models."router-reason"]
description = "Reasoning-first routing with a lower-cost fallback"
routing_strategy = "cost-based-routing"
num_retries = 2
enable_pre_call_checks = true
fallbacks = ["router-code"]
context_window_fallbacks = ["gemini-2.5-flash"]
content_policy_fallbacks = ["gemini-2.5-flash"]

[[router_models."router-reason".backends]]
provider_id       = "vertex_ai"
litellm_provider   = "vertex_ai"
model             = "gemini-2.5-pro"
project_env       = "VERTEX_AI_PROJECT"
vertex_location_env    = "VERTEX_AI_LOCATION"
vertex_credentials_env  = "GOOGLE_APPLICATION_CREDENTIALS"
order             = 1
cost_input_per1k  = 0.00125
cost_output_per1k = 0.01000

[[router_models."router-reason".backends]]
provider_id       = "dashscope"
litellm_provider   = "dashscope"
model             = "qwen-max"
api_key_env       = "DASHSCOPE_API_KEY"
endpoint_env      = "DASHSCOPE_ENDPOINT"
order             = 2
cost_input_per1k  = 0.00400
cost_output_per1k = 0.01200

