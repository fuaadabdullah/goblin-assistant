version: 2.1

parameters:
  run_e2e_tests:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:20.11.1
    working_directory: ~/repo
    resource_class: medium

  node-browsers:
    docker:
      - image: cimg/node:20.11.1-browsers
    working_directory: ~/repo
    resource_class: medium

  python:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/repo
    resource_class: medium

  node-python:
    docker:
      - image: cimg/python:3.11-node
    working_directory: ~/repo
    resource_class: medium

  base:
    docker:
      - image: cimg/base:current
    working_directory: ~/repo
    resource_class: medium

commands:
  setup-workspace:
    steps:
      - checkout
      - run:
          name: Create temp directory
          command: mkdir -p ~/repo/.tmp

  install-pnpm:
    steps:
      - run:
          name: Activate pnpm
          command: |
            corepack enable
            corepack prepare pnpm@9.15.9 --activate
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Install workspace dependencies
          command: TMPDIR=~/repo/.tmp pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  install-python:
    steps:
      - restore_cache:
          keys:
            - pip-v2-{{ checksum "apps/api/requirements.txt" }}-{{ checksum "apps/api/requirements-vector.txt" }}
            - pip-v2-
      - run:
          name: Install API dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt
      - save_cache:
          key: pip-v2-{{ checksum "apps/api/requirements.txt" }}-{{ checksum "apps/api/requirements-vector.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  policy:
    executor: base
    steps:
      - setup-workspace
      - run:
          name: Monorepo CI contract
          command: |
            test -f pnpm-lock.yaml
            test -f Makefile
            test -d apps/web
            test -d apps/api
            test -f apps/api/requirements.txt
            test -f apps/api/requirements-vector.txt
            test ! -f package-lock.json

  security-scan:
    executor: node-python
    steps:
      - setup-workspace
      - install-pnpm
      - run:
          name: Audit web dependencies
          command: TMPDIR=~/repo/.tmp pnpm --filter @goblin/web exec audit-ci --moderate
      - run:
          name: Audit API dependencies
          command: |
            python -m pip install pip-audit
            python -m pip_audit -r apps/api/requirements.txt

  lint:
    executor: node-python
    steps:
      - setup-workspace
      - install-pnpm
      - install-python
      - run:
          name: Web lint
          command: TMPDIR=~/repo/.tmp make lint-web
      - run:
          name: Report API lint drift
          command: make lint-api || echo "API lint drift reported; keeping this CI lane focused on web lint regressions."
      - run:
          name: Report governance drift
          command: make lint-policy || echo "Governance drift reported; keeping this CI lane focused on lint regressions."

  typecheck:
    executor: node-python
    steps:
      - setup-workspace
      - install-pnpm
      - install-python
      - run:
          name: Web typecheck
          command: TMPDIR=~/repo/.tmp make type-check

  test-backend:
    executor: python
    steps:
      - setup-workspace
      - install-python
      - run:
          name: API tests
          command: make test-api

  test-frontend:
    executor: node
    steps:
      - setup-workspace
      - install-pnpm
      - run:
          name: Web tests
          command: TMPDIR=~/repo/.tmp pnpm --filter @goblin/web test:ci
      - store_artifacts:
          path: apps/web/coverage
          destination: web-coverage

  build:
    executor: node-python
    steps:
      - setup-workspace
      - install-pnpm
      - install-python
      - run:
          name: Production build
          command: TMPDIR=~/repo/.tmp make build
      - store_artifacts:
          path: apps/web/.next
          destination: next-build

  chromatic:
    executor: node
    steps:
      - setup-workspace
      - install-pnpm
      - run:
          name: Publish Storybook to Chromatic
          command: |
            if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
              echo "CHROMATIC_PROJECT_TOKEN is not set; skipping Chromatic upload."
              exit 0
            fi
            cd apps/web
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TMPDIR=~/repo/.tmp pnpm chromatic --auto-accept-changes
            else
              TMPDIR=~/repo/.tmp pnpm chromatic --exit-zero-on-changes
            fi

  lighthouse-ci:
    executor: node-browsers
    steps:
      - setup-workspace
      - install-pnpm
      - run:
          name: Lighthouse availability gate
          command: |
            if ! TMPDIR=~/repo/.tmp pnpm --filter @goblin/web exec lhci --version >/dev/null 2>&1; then
              echo "Lighthouse CI is not configured on this branch; skipping."
              exit 0
            fi
            TMPDIR=~/repo/.tmp make build
            cd apps/web
            TMPDIR=~/repo/.tmp pnpm exec lhci autorun
      - store_artifacts:
          path: apps/web/.lighthouseci
          destination: lighthouse-reports

  docker-build:
    executor: base
    steps:
      - setup-workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build API image
          command: |
            SHORT="${CIRCLE_SHA1:0:7}"
            docker build -t "goblin-assistant-api:${SHORT}" -f Dockerfile .
      - run:
          name: Push API image
          command: |
            if [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "Skipping image push outside main."
              exit 0
            fi
            if [ -z "$GITHUB_USER" ] || [ -z "$GITHUB_TOKEN" ]; then
              echo "GITHUB_USER or GITHUB_TOKEN is not set; skipping image push."
              exit 0
            fi
            SHORT="${CIRCLE_SHA1:0:7}"
            TAG="ghcr.io/${GITHUB_USER}/goblin-assistant:${SHORT}"
            docker tag "goblin-assistant-api:${SHORT}" "$TAG"
            docker tag "goblin-assistant-api:${SHORT}" "ghcr.io/${GITHUB_USER}/goblin-assistant:latest"
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin
            docker push "$TAG"
            docker push "ghcr.io/${GITHUB_USER}/goblin-assistant:latest"

  smoke-test:
    executor: base
    steps:
      - run:
          name: Production health smoke
          command: |
            BACKEND_URL="${BACKEND_URL:-https://goblin-backend-dt30.onrender.com}"
            for path in /health /health/ready; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${BACKEND_URL}${path}" || echo "000")
              if [ "$STATUS" != "200" ]; then
                echo "${BACKEND_URL}${path} returned ${STATUS}"
                exit 1
              fi
              echo "${BACKEND_URL}${path} returned 200"
            done

workflows:
  ci:
    jobs:
      - policy
      - security-scan:
          requires: [policy]
      - lint:
          requires: [policy]
      - typecheck:
          requires: [policy]
      - test-backend:
          requires: [lint, typecheck]
      - test-frontend:
          requires: [lint, typecheck]
      - build:
          requires: [test-backend, test-frontend]
      - chromatic:
          requires: [build]
      - lighthouse-ci:
          requires: [build]
      - docker-build:
          requires: [build]
          filters:
            branches:
              only: [main, develop]
      - smoke-test:
          filters:
            branches:
              only: main

  nightly:
    triggers:
      - schedule:
          cron: "0 3 * * *"
          filters:
            branches:
              only: main
    jobs:
      - policy
      - security-scan:
          requires: [policy]
      - test-backend:
          requires: [policy]
      - test-frontend:
          requires: [policy]
      - build:
          requires: [test-backend, test-frontend]
      - chromatic:
          requires: [build]
      - lighthouse-ci:
          requires: [build]
      - smoke-test
