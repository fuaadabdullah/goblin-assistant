version: 2.1

parameters:
  run_e2e_tests:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:22.15
    working_directory: ~/repo
    resource_class: medium

  python:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/repo
    resource_class: medium

  node-python:
    docker:
      - image: cimg/python:3.11-node
    working_directory: ~/repo
    resource_class: medium

  base:
    docker:
      - image: cimg/base:current
    working_directory: ~/repo
    resource_class: medium

commands:
  setup-tmpdir:
    steps:
      - run:
          name: Create .tmp directory
          command: mkdir -p ~/repo/.tmp

  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9.15.9
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install Node dependencies
          command: TMPDIR=~/repo/.tmp pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  install-python:
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "apps/api/requirements.txt" }}-{{ checksum "apps/api/requirements-vector.txt" }}
            - pip-v1-
      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-vector.txt
      - save_cache:
          key: pip-v1-{{ checksum "apps/api/requirements.txt" }}-{{ checksum "apps/api/requirements-vector.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  policy:
    executor: base
    steps:
      - checkout
      - run:
          name: Branch and commit policy
          command: bash tooling/automation/ci-policy-check.sh

  security-scan:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - run:
          name: Install security tools
          command: python -m pip install pip-audit bandit
      - run:
          name: Security bucket
          command: make test-security

  format-check:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - install-python
      - run:
          name: Format check
          command: make format-check

  lint:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - install-python
      - run:
          name: Lint
          command: make lint

  typecheck:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - install-python
      - run:
          name: Install API type-checkers
          command: python -m pip install mypy pyright
      - run:
          name: Type check
          command: make type-check
      - run:
          name: API mypy subset
          command: make type-check-api-mypy
      - run:
          name: API pyright subset
          command: make type-check-api-pyright

  contract:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - install-python
      - run:
          name: Contract checks
          command: make contract-checks

  test-backend:
    executor: python
    steps:
      - checkout
      - setup-tmpdir
      - install-python
      - run:
          name: API tests with coverage
          command: make test-api-coverage
      - store_artifacts:
          path: apps/api/htmlcov
          destination: api-coverage-html

  test-frontend:
    executor: node
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - run:
          name: Web tests with coverage
          command: TMPDIR=~/repo/.tmp pnpm --filter @goblin/web test:coverage
      - run:
          name: E2E budget check
          command: make test-e2e-budget
      - store_artifacts:
          path: apps/web/coverage
          destination: web-coverage

  build:
    executor: node-python
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - install-python
      - run:
          name: Build
          command: TMPDIR=~/repo/.tmp make build
      - store_artifacts:
          path: apps/web/.next
          destination: next-build

  docker-build:
    executor: base
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            SHORT="${CIRCLE_SHA1:0:7}"
            docker build -t "goblin-assistant:${SHORT}" -f Dockerfile .

  lighthouse-ci:
    docker:
      - image: cimg/node:22.15-browsers
    working_directory: ~/repo
    resource_class: medium
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - run:
          name: Build for Lighthouse
          command: TMPDIR=~/repo/.tmp make build
      - run:
          name: Lighthouse CI
          command: |
            cd apps/web
            TMPDIR=~/repo/.tmp pnpm lhci autorun
      - store_artifacts:
          path: apps/web/.lighthouseci
          destination: lighthouse-reports

  chromatic:
    executor: node
    steps:
      - checkout
      - setup-tmpdir
      - install-pnpm
      - run:
          name: Publish Storybook to Chromatic
          command: |
            if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
              echo "CHROMATIC_PROJECT_TOKEN not set; skipping Chromatic upload."
              exit 0
            fi
            cd apps/web
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TMPDIR=~/repo/.tmp pnpm chromatic --auto-accept-changes
            else
              TMPDIR=~/repo/.tmp pnpm chromatic --exit-zero-on-changes
            fi

  smoke-test:
    executor: base
    steps:
      - run:
          name: Production health smoke
          command: |
            BACKEND_URL="${BACKEND_URL:-https://goblin-backend-dt30.onrender.com}"
            for path in /api/v1/health /api/v1/health/ready; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${BACKEND_URL}${path}" || echo "000")
              if [ "$STATUS" != "200" ]; then
                echo "${BACKEND_URL}${path} returned ${STATUS}"
                exit 1
              fi
              echo "${BACKEND_URL}${path} returned 200"
            done

workflows:
  ci:
    jobs:
      - policy
      - security-scan:
          requires: [policy]
      - format-check:
          requires: [policy]
      - lint:
          requires: [format-check, security-scan]
      - typecheck:
          requires: [format-check, security-scan]
      - contract:
          requires: [lint, typecheck]
      - test-backend:
          requires: [contract]
      - test-frontend:
          requires: [contract]
      - build:
          requires: [test-backend, test-frontend]
      - docker-build:
          requires: [build]
          filters:
            branches:
              only: [main, develop]
      - chromatic:
          requires: [build]
      - lighthouse-ci:
          requires: [build]
          filters:
            branches:
              only: [main, develop]
      - smoke-test:
          filters:
            branches:
              only: main

  nightly:
    triggers:
      - schedule:
          cron: "0 3 * * *"
          filters:
            branches:
              only: main
    jobs:
      - security-scan
      - test-backend
      - test-frontend
      - build
      - chromatic:
          requires: [build]
      - lighthouse-ci:
          requires: [build]
      - smoke-test
