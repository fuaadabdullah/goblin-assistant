[build-system]
requires = [ "setuptools>=68", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-assistant-api"
version = "0.1.0"
description = "Goblin Assistant FastAPI backend"
requires-python = ">=3.11"
readme = "src/api/README.md"
dependencies = [
    # ---- FastAPI / ASGI ----
    "fastapi>=0.111.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    # ---- Database ----
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # ---- Observability ----
    "sentry-sdk>=2.0.0",
    "ddtrace>=2.0.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    # ---- HTTP clients ----
    "httpx>=0.27.0",
    "requests>=2.34.2",
    "aiohttp>=3.9.0",
    # ---- Supabase ----
    "supabase>=1.0.0",
    # ---- Secrets / Auth ----
    "hvac>=1.2.0",
    "google-auth>=2.49.0",
    "pyjwt[crypto]>=2.12.0",
    "bcrypt>=4.0.1",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "email-validator>=2.3.0",
    "bleach>=6.1.0",
    # ---- LLM providers ----
    "openai>=1.12.0",
    "anthropic>=0.21.3",
    "litellm==1.92.0",
    "tiktoken>=0.7.0",
    # ---- Task queue ----
    "celery[redis]>=5.3.0",
    "flower>=2.0.0",
    "APScheduler>=3.10.0",
    "rq>=1.15.0",
    # ---- Cloud / Infra ----
    "docker>=7.0.0",
    "boto3>=1.34.0",
    "kubernetes>=30.1.0",
    # ---- Misc runtime ----
    "redis>=5.0.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9.0",
    # ---- Financial data ----
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # ---- Web search fallback ----
    "duckduckgo-search>=6.0.0",
    # ---- PDF extraction ----
    "pypdf>=6.14.2",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.11.0",
    "pyright>=1.1.390",
    "ruff>=0.6.0",
    "vulture>=2.11",
    "pip-audit>=2.7.0",
]
vector = [
    "chromadb>=0.4.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
disallow_any_generics = true
ignore_missing_imports = true
exclude = [ "^src/api/docs/.*", "^src/api/tests/.*", "^src/api/test_.*\\.py$",]

[tool.vulture]
min_confidence = 80
paths = [ "src/api",]
ignore_names = [ "test_*", "*_test", "conftest", "exc_type", "exc_val", "exc_tb", "tb", "csrf_always_valid", "rate_limit_open", "event_db",]
ignore_decorators = [ "@app.route", "@router.*", "@pytest.*",]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [ "src",]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest_cache"
testpaths = [ "src/api", "src/api/tests",]
python_files = [ "test_*.py",]
python_classes = [ "Test*",]
python_functions = [ "test_*",]
addopts = [ "--strict-markers", "--strict-config", "--disable-warnings", "--tb=short",]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = [ "api",]
branch = true
omit = [ "*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/migrations/*", "*/conftest.py",]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [ "pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod",]

[tool.ruff.lint]
select = [ "E", "F", "I", "N", "PL", "SIM", "ARG", "ASYNC",]
ignore = [ "E402", "E501", "PLC0415", "PLR0913", "PLR2004", "ARG001", "N806", "N815", "PLW2901", "SIM102", "SIM105", "SIM108", "SIM117", "PLR0912", "PLR0915", "PLR0911", "PLW0603", "ASYNC109", "ARG002", "ARG005", "SIM103",]

[tool.setuptools.packages.find]
where = [ "src",]
include = [ "api*",]

[tool.ruff.lint.isort]
known-first-party = [ "api",]

[tool.ruff.lint.pylint]
max-statements = 40
max-branches = 10
max-returns = 8
max-nested-blocks = 3