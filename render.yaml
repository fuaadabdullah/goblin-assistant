services:
  - type: web
    name: goblin-backend
    runtime: docker
    region: virginia
    plan: free
    # Auto-deploy main after its linked CI checks pass. This requires the
    # GitHub repository to be connected in the Render dashboard.
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health

    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: RELEASE_VERSION
        value: goblin-assistant@1.0.0
      - key: BACKEND_URL
        value: https://goblin-backend-dt30.onrender.com
      - key: FRONTEND_URL
        value: https://goblin-assistant.vercel.app

      # Allowed Origins
      - key: ALLOWED_ORIGINS
        value: https://goblin-assistant.vercel.app,https://goblin-backend-dt30.onrender.com

      # Rate Limiting
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW
        value: "60"

      # Manually-managed secrets (Sentry, Supabase, JWT signing key, all
      # provider API keys) live in the shared env group below so they are
      # declared once and never overwritten by blueprint syncs.
      # See docs/operations/RENDER_SECRETS.md for the exact key list.
      - fromGroup: goblin-shared-secrets

      # GCP LLM Endpoints (removed - VMs terminated since 2026-01-11)
      # Re-add OLLAMA_GCP_URL / LLAMACPP_GCP_URL here after redeploying GCP infra

      # Same-region private Key Value connection
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goblin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: goblin-postgres
          property: connectionString

    # Secrets are managed via the goblin-shared-secrets environment group.
    # Render does not permit sync:false entries inside Blueprint-managed
    # groups, so values and exact key names are managed in the dashboard and
    # audited with docs/operations/RENDER_SECRETS.md.
    #
    # Stale / no longer needed for Render (GCP VMs terminated 2026-01-11):
    # - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (was for self-hosted MinIO)
    # - OLLAMA_GCP_URL / LLAMACPP_GCP_URL (VMs removed)
    
    # Custom domain
    # customDomains:
    # No custom domain configured
    
  - type: keyvalue
    name: goblin-redis
    region: virginia
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: goblin-postgres
    databaseName: goblin_assistant
    user: goblin_assistant
    region: virginia
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []

# =============================================================================
# Shared secrets environment group
# -----------------------------------------------------------------------------
# Single source of truth for every manually-managed secret used by the
# goblin-backend service (referenced above via `fromGroup`).
#
# Render does not allow `sync: false` inside an environment group. The
# Blueprint owns the group and service link; operators add the documented
# secret keys and values in the Render dashboard. Omitted dashboard variables
# are preserved by later Blueprint syncs.
# =============================================================================
envVarGroups:
  - name: goblin-shared-secrets
    # Secret key names and values are managed in the Render dashboard. Render
    # does not allow sync:false variables inside Blueprint environment groups.
    envVars: []
