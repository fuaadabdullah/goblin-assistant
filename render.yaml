services:
  - type: web
    name: goblin-backend
    runtime: docker
    region: virginia
    plan: free
    startCommand: /app/start.sh
    preDeployCommand: cd apps/api && alembic upgrade head
    healthCheckPath: /api/v1/health
    
    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: RELEASE_VERSION
        value: goblin-assistant@1.0.0
      - key: BACKEND_URL
        value: https://goblin-backend-dt30.onrender.com
      - key: FRONTEND_URL
        value: https://goblin-assistant.vercel.app

      # Error Tracking with Sentry
      - key: SENTRY_DSN
        sync: false  # Keep sync: false, will be set manually in Render dashboard
      - key: LOCAL_LLM_API_KEY
        sync: false
      
      # Allowed Origins  
      - key: ALLOWED_ORIGINS
        value: https://goblin-assistant.vercel.app,https://goblin-backend-dt30.onrender.com

      # Rate Limiting
      # NOTE: the enforcement code (bootstrap/middleware.py) reads
      # RATE_LIMIT_PER_MINUTE / RATE_LIMIT_PER_HOUR, not RATE_LIMIT_REQUESTS /
      # RATE_LIMIT_WINDOW — those were dead vars that never reached the
      # limiter and silently left it on its 100/min, 1000/hour code defaults.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"

      # Tailnet access to the self-hosted llama.cpp node (Oracle A1, never public).
      # TAILSCALE_AUTHKEY: reusable + ephemeral + pre-tagged tag:goblin-render.
      - key: TAILSCALE_AUTHKEY
        sync: false
      - key: TAILSCALE_HOSTNAME
        value: goblin-render
      - key: LLAMACPP_ORACLE_ENDPOINT
        value: http://100.107.126.121:8081
      - key: LLAMACPP_ORACLE_PROXY
        value: http://localhost:1055
      - key: LLAMACPP_ORACLE_API_KEY
        sync: false

      # Same-region private Key Value connection
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: goblin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: goblin-postgres
          property: connectionString

      # Required for validating Supabase sessions forwarded by the web app.
      # Values are managed in Render and intentionally not committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    
    # Secrets (set manually in Render dashboard)
    # These should be set as Environment Variables with "sync: false"
    # - SENTRY_DSN (already listed above)
    # - OPENAI_API_KEY
    # - ANTHROPIC_API_KEY
    # - GOOGLE_AI_API_KEY
    # - JWT_SECRET_KEY
    # - SUPABASE_SERVICE_ROLE_KEY
    # - AZURE_API_KEY
    # - AZURE_OPENAI_ENDPOINT
    # - AWS_ACCESS_KEY_ID
    # - AWS_SECRET_ACCESS_KEY
    
    # Automatic deployment on git push
    # (requires connecting GitHub repo in Render dashboard)
    
    # Custom domain
    # customDomains:
    # No custom domain configured

    # No buildCommand: this service runs `runtime: docker`, so Render builds
    # straight from ./Dockerfile and ignores buildCommand/startCommand-style
    # native-runtime build steps. The Dockerfile's own `deps` stage installs
    # from apps/api/requirements.lock.txt (the pinned, uv-compiled lock file),
    # not the loose requirements.txt a buildCommand here used to reference.

  - type: keyvalue
    name: goblin-redis
    region: virginia
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: goblin-postgres
    databaseName: goblin_assistant
    user: goblin_assistant
    region: virginia
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
