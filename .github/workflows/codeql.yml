name: CodeQL

# Static analysis gate for PRs touching application code. Push is limited to
# main/develop (the auto-generated CodeQL workflow was disabled entirely to
# prevent billing failures); PR runs are path-filtered so docs-only changes
# cost nothing.
#
# Zero-cost alternative if Actions minutes stay locked: `make lint` already
# runs ESLint + Ruff on every PR, and CircleCI's security-scan runs
# secret-scan + pip-audit + audit-ci. This workflow adds CodeQL's
# deeper dataflow analysis, which those linters do not cover.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tooling/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'apps/web/src/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to analyze'
        required: false
        default: 'python'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
